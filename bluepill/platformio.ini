; Bluepill (STM32F103C8, 72 MHz) — Blackpill firmware'inin aynısı
;   env:txrx : gönderici (PA8) + okuyucu (PB6) + tetik çıkışı (PB0)
;   env:tx   : sadece gönderici (+ tetik)
;   env:rx   : sadece okuyucu
; F103'te USB DFU bootloader yok: yükleme ST-Link ile (SWDIO/SWCLK/GND/3.3V) `pio run -e txrx -t upload`
[platformio]
default_envs = txrx

[env]
platform = ststm32@19.3.0
board = bluepill_f103c8
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
lib_deps = symlink://../common
lib_ldf_mode = chain+
build_flags = -Wall -Wextra -I include

[env:tx]
build_flags = ${env.build_flags} -DBOARD_HAS_TX=1 -DBOARD_HAS_RX=0

[env:txrx]
build_flags = ${env.build_flags} -DBOARD_HAS_TX=1 -DBOARD_HAS_RX=1

[env:rx]
build_flags = ${env.build_flags} -DBOARD_HAS_TX=0 -DBOARD_HAS_RX=1
