; Blackpill (STM32F401CC / F411CE — tek imaj, 84 MHz)
;   env:tx   : sadece DShot gönderici
;   env:txrx : gönderici (PA8) + okuyucu (PB6)
; Yükleme: BOOT0 basılıyken NRST → DFU modu, sonra `pio run -e txrx -t upload`
[platformio]
default_envs = txrx

[env]
platform = ststm32@19.3.0
board = blackpill_f401cc
framework = stm32cube
upload_protocol = dfu
lib_deps = symlink://../common
lib_ldf_mode = chain+
build_flags = -Wall -Wextra -I include

[env:tx]
build_flags = ${env.build_flags} -DBOARD_HAS_TX=1 -DBOARD_HAS_RX=0

[env:txrx]
build_flags = ${env.build_flags} -DBOARD_HAS_TX=1 -DBOARD_HAS_RX=1
